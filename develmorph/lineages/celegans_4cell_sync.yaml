# C. elegans 4-cell stage: sequential AB then P1 division with settling gaps
#
# Biological timing:
#   1. P0 divides into AB (anterior) and P1 (posterior) along AP axis.
#   2. AB and P1 settle for ~50 steps (2-cell physical equilibration).
#   3. AB divides into ABa (anterior) and ABp (posterior) along AP axis.
#      ABp is positioned adjacent to P1, touching it.
#   4. The 3-cell stage (ABa, ABp, P1) settles for ~20 steps.
#      During this time ABp presses against P1, shifting P1 slightly posteriorly.
#   5. P1 divides into EMS (anterior) and P2 (posterior) along AP axis.
#      Because P1 has been pressed by ABp, EMS starts closer to ABp than
#      in the synchronous case, reducing the barrier to diamond formation.
#
# Expected outcome: ABa-P2 aligned with AP (X) axis, ABp-EMS aligned with DV (Y) axis.

lineage_id: celegans_4cell_sync

steps:
  # 1-cell -> 2-cell
  - step: 1
    divisions:
      - parent: P0
        axis: major_axis
        daughters: [AB, P1]
        volume_ratio: 0.6

  # 2-cell -> 3-cell (AB divides; 50 steps after P0 division)
  # ABp is placed between ABa and P1, in contact with P1.
  - step: 51
    divisions:
      - parent: AB
        axis: major_axis
        daughters: [ABa, ABp]
        volume_ratio: 0.5

  # 3-cell -> 4-cell (P1 divides; 20 steps after AB division)
  # EMS (anterior daughter of P1) is placed adjacent to ABp.
  # P2 (posterior daughter) goes to the posterior pole.
  - step: 71
    divisions:
      - parent: P1
        axis: major_axis
        daughters: [EMS, P2]
        volume_ratio: 0.6
